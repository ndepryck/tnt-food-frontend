# Overlay on ../compose.yaml ONLY. Use a separate project (see docs/testing.md).
services:
  backend:
    ports: !override
      - "127.0.0.1:18000:8000"
    command: ["sh", "-ec", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 30
  db:
    ports: !override []
